monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Y_EarPods.*"
      }
      {
        node.name = "~alsa_input.usb-Y_EarPods.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false
      }
    }
  }
]
