


# Keyring and auth
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

#xdg portal
#new
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland && systemctl --user start xdg-desktop-portal-hyprland

#ol dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland && systemctl --user start xdg-desktop-portal-hyprlandd
#exec-once = /usr/lib/xdg-desktop-portal-hyprland &
#exec-once = /usr/lib/xdg-desktop-portal &




# Clipboard history
exec-once =  wl-clip-persist --clipboard both
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /home/aws/.config/hypr/hyprland/extra/clipboard-bridge.sh 



# Auto delete trash 30 days old
exec-once = trash-empty 30

# Cursors
exec-once = hyprctl setcursor $cursorTheme $cursorSize
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
exec-once = gsettings set org.gnome.desktop.interface cursor-size $cursorSize

# Location provider and night light
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = sleep 1 && gammastep

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy

# Resize and move windows based on matches (e.g. pip)
exec-once = caelestia resizer -d

# Start shell
exec-once = caelestia shell -d
exec-once = /home/aws/.config/hypr/hyprland/idlescripts/restore-idle-state.sh


#start openrgb server
#exec-once=sudo systemctl start openrgb


#boost laptop fans
exec-once = sudo isw -b on

#enable kdeconnect (controlling pc using another device)
exec-once = kdeconnectd


#updating apps
exec-once = vencord-update

#setting default mic options
exec-once = openrgb --color FF0000 &
exec-once = sleep 4 && wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 1

#other
exec-once = systemctl --user enable opentabletdriver.service --now 
exec-once = /home/aws/.config/AwsScripts/disks/mount-usb.sh 
